version: 2

project_name: go-ocproxy

archives:
  - id: linux
    ids:
      - linux-amd64
    formats:
      - tar.gz
    files:
      - LICENSE
  - id: macos
    ids:
      - macos-arm64
    formats:
      - tar.gz
    files:
      - LICENSE
  - id: windows
    ids:
      - windows-amd64
    formats:
      - zip
    files:
      - LICENSE
builds:
  - id: linux-amd64
    main: .
    goos:
      - linux
    goarch:
      - amd64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"
  - id: macos-arm64
    main: .
    goos:
      - darwin
    goarch:
      - arm64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"
  - id: windows-amd64
    main: .
    goos:
      - windows
    goarch:
      - amd64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"
